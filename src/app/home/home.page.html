<ion-header>
  <ion-toolbar>
    <ion-title>Proyecto Alfa</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">Salir</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="max-width:480px;margin:0 auto;">
    <h2 class="ion-text-center">Bienvenido a la aplicación del Preuniversitario Proyecto Alfa</h2>
    <p class="ion-text-center"> <b>{{ rol }}</b></p>

    <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-button expand="block" routerLink="/universidades">Universidades públicas</ion-button>
        </ion-col>

        <ion-col size="12">
          <ion-button expand="block" routerLink="/carreras">Carreras ofertadas</ion-button>
        </ion-col>

        <ion-col size="12">
          <ion-button expand="block" routerLink="/porcentaje">Cálculo por porcentaje</ion-button>
        </ion-col>

        <ion-col size="12">
          <ion-button expand="block" routerLink="/simulador">Simulador de examen</ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </div>
</ion-content>
