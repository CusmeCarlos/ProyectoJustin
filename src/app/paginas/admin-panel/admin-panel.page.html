<ion-header>
  <ion-toolbar color="dark">
    <ion-title>Panel de Administración</ion-title>
     <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-list>

    <ion-item button detail (click)="ir('/admin-universidades')">
      <ion-label>
        <h2>🏛 Universidades</h2>
        <p>Administrar universidades y áreas del examen</p>
      </ion-label>
    </ion-item>

    <ion-item button detail (click)="ir('/admin-carreras')">
      <ion-label>
        <h2>📚 Carreras</h2>
        <p>Crear y administrar las carreras ofertadas</p>
      </ion-label>
    </ion-item>

    <ion-item button detail (click)="ir('/admin-preguntas')">
      <ion-label>
        <h2>❓ Banco de Preguntas</h2>
        <p>Agregar, importar y gestionar preguntas</p>
      </ion-label>
    </ion-item>

    <ion-item button detail (click)="ir('/admin-historial')">
      <ion-label>
        <h2>📊 Historial del Simulador</h2>
        <p>Revisar intentos por universidad</p>
      </ion-label>
    </ion-item>

  </ion-list>

</ion-content>
